    /* LAYOUT */
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }

    /* HEADER */
    .header-card {

      border: 1px solid #e5e7eb; padding: 28px 36px; margin-bottom: 24px;

    }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .logo-sr { font-size: 48px; font-style: italic; font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif; color: #2c2c2c; line-height: 1; }
    .header-divider { width: 1px; height: 44px; background: #e5e7eb; }
    .brand-name { font-size: 26px; font-weight: 300; letter-spacing: 0.15em; color: #2c2c2c; line-height: 1; }
    .brand-sub { font-size: 10px; letter-spacing: 0.12em; color: #9ca3af; margin-top: 4px; }
    .header-right { text-align: right; }
    .client-name { font-size: 18px; font-weight: 600; color: #1e3a8a; }
    .client-period { font-size: 13px; color: #9ca3af; margin-top: 2px; }

    /* SELETOR */
    .selector-wrap { margin-bottom: 24px; }
    .selector-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #9ca3af; margin-bottom: 10px; }
    .selector { display: flex; flex-wrap: wrap; gap: 8px; }
    .sel-btn {
      padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1.5px solid #e5e7eb; background: white; color: #6b7280;
      transition: all 0.15s; font-family: 'Mukta', sans-serif; position: relative;
    }
    .sel-btn:hover { border-color: #1e3a8a; color: #1e3a8a; }
    .sel-btn.active { background: #1e3a8a; border-color: #1e3a8a; color: white; }
    .sel-btn .tag-atual {
      position: absolute; top: -4px; right: -4px;
      background: #22c55e; color: white; font-size: 8px; font-weight: 700;
      padding: 1px 5px; border-radius: 10px; letter-spacing: 0.05em;
    }
    .sel-divider { display: flex; align-items: center; color: #d1d5db; font-size: 18px; }

    /* BANNER */
    .banner {
      border-radius: 20px; padding: 24px 32px; margin-bottom: 24px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .banner-left { display: flex; align-items: center; gap: 16px; }
    .banner-icon { background: white; border-radius: 50%; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 22px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
    .banner-title { font-size: 20px; font-weight: 700; color: white; }
    .banner-sub { font-size: 13px; color: rgba(255,255,255,0.8); margin-top: 2px; }
    .banner-right { text-align: right; }
    .banner-value { font-size: 28px; font-weight: 700; color: white; }
    .banner-proj { font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 2px; }

    /* BARRAS DE PROGRESSO */
    .progress-section { background: white; border-radius: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; padding: 28px 32px; margin-bottom: 24px; }
    .section-title { font-size: 16px; font-weight: 600; color: #1f2937; margin-bottom: 20px; }
    .prog-row { margin-bottom: 20px; }
    .prog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .prog-label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; }
    .prog-values { font-size: 13px; font-weight: 600; color: #1f2937; }
    .prog-track { height: 10px; background: #f3f4f6; border-radius: 99px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
    .prog-foot { display: flex; justify-content: space-between; margin-top: 4px; }
    .prog-pct { font-size: 11px; font-weight: 600; }
    .prog-meta { font-size: 11px; color: #9ca3af; }

    @media(min-width:640px){ .kpis { grid-template-columns: repeat(4,1fr); } }
    .kpi-card { background: white; border-radius: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; padding: 20px; transition: box-shadow 0.2s; }

    .kpi-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .kpi-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #9ca3af; }

    .kpi-value { font-size: 22px; font-weight: 700; color: #1f2937; line-height: 1; }
    .kpi-sub { font-size: 11px; color: #9ca3af; margin-top: 4px; }

    @media(min-width:640px){ .bottom { grid-template-columns: 1fr 1fr; } }

    .insight-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid; }

    .insight-item.neg { background: #fef2f2; border-color: #fecaca; }
    .insight-item.neu { background: #fffbeb; border-color: #fde68a; }

    .insight-dot.pos { background: #22c55e; }
    .insight-dot.neg { background: #ef4444; }
    .insight-dot.neu { background: #f59e0b; }
    .insight-txt { font-size: 13px; color: #374151; line-height: 1.5; }
    .acao-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }

// UTILITÁRIOS
// ═══════════════════════════════════════════════════════
const fmt = v => "R$ " + Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = (r,m) => ((r/m)*100).toFixed(1);

const corBarra = (r,m) => {
  const p = r/m;
  if(p >= 1) return "#16a34a";
  if(p >= 0.8) return "#f59e0b";
  return "#ef4444";
};
const corLabel = (r,m) => {
  const p = r/m;
  if(p >= 1) return "#16a34a";
  if(p >= 0.8) return "#d97706";
  return "#dc2626";
};

let chartA = null, chartB = null;
let idxAtual = HISTORICO.length - 1;

// ═══════════════════════════════════════════════════════
// RENDER SELETOR
// ═══════════════════════════════════════════════════════
function renderSeletor(){
  const el = document.getElementById("selector");
  // Agrupar por mês
  let html = "";
  let mesAnterior = "";
  HISTORICO.forEach((h,i) => {
    if(h.mesAno !== mesAnterior && mesAnterior !== ""){
      html += `<div class="sel-divider">·</div>`;
    }
    mesAnterior = h.mesAno;
    const isAtual = h.status === "atual";
    const tagTxt = isAtual ? "Atual" : h.tag;
    html += `<button class="sel-btn ${i===idxAtual?"active":""}" onclick="irPara(${i})">
      ${h.rotulo}
      ${tagTxt ? `<span class="tag-atual">${tagTxt}</span>` : ""}
    </button>`;
  });
  el.innerHTML = html;
}

// RENDER CONTEÚDO
// ═══════════════════════════════════════════════════════
function renderConteudo(){
  const p = HISTORICO[idxAtual];

  const acima = p.faturamento.realizado >= p.faturamento.meta;
  const projPct = p.faturamento.projecao ? pct(p.faturamento.projecao, p.faturamento.meta) : null;

  document.getElementById("header-period").textContent = `${p.mesAno} — ${p.periodo}`;
  document.getElementById("footer-txt").textContent = `${p.mesAno} · ${p.periodo}`;

  // BARRAS KPI
  const progRow = (label, real, meta, fmtFn, unit="") => {
    const c = corBarra(real,meta);
    const cl = corLabel(real,meta);
    const w = Math.min((real/meta)*100,100);
    const pe = pct(real,meta);
    return `
    <div class="prog-row">
      <div class="prog-header">
        <span class="prog-label">${label}</span>
        <span class="prog-values">${fmtFn(real)}${unit} <span style="color:#9ca3af;font-weight:400">/ ${fmtFn(meta)}${unit}</span></span>
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${w}%;background:${c}"></div></div>
      <div class="prog-foot">
        <span class="prog-pct" style="color:${cl}">${pe}% da meta${parseFloat(pe)>=100?" ✓":""}</span>
        <span class="prog-meta">Média diária: ${fmt(p.mediaDiaria)}</span>
      </div>
    </div>`;
  };

  // SEMANAS
  const semanasHtml = p.semanais.map(s => {
    const isPendente = s.ok === null;
    const statusCls = isPendente ? "sem-pend" : s.ok ? "sem-ok" : "sem-fail";
    const statusTxt = isPendente ? "Pendente" : s.ok ? "✓ Acima da meta" : "✗ Abaixo da meta";
    return `
    <div class="sem-item">
      <div>
        <div class="sem-label">${s.s}</div>
        <div class="sem-meta">Meta: ${fmt(s.meta)}</div>
      </div>
      <div>
        <div class="sem-val">${isPendente ? "—" : fmt(s.real)}</div>
        <div class="sem-status ${statusCls}">${statusTxt}</div>
      </div>
    </div>`;
  }).join("");

  // ANÁLISE BOX
  const analiseColors = {
    green: { bg:"#f0fdf4", border:"#bbf7d0", txt:"#15803d" },
    blue:  { bg:"#eff6ff", border:"#bfdbfe", txt:"#1d4ed8" },
    amber: { bg:"#fffbeb", border:"#fde68a", txt:"#b45309" },
    red:   { bg:"#fef2f2", border:"#fecaca", txt:"#dc2626" },
  };
  const ac = analiseColors[p.analise.cor] || analiseColors.blue;
  const acaoCores = {
    green: { bg:"#f0fdf4", border:"#bbf7d0", txt:"#15803d" },
    blue:  { bg:"#eff6ff", border:"#bfdbfe", txt:"#1d4ed8" },
    amber: { bg:"#fffbeb", border:"#fde68a", txt:"#b45309" },
  };
  const acc = acaoCores[p.acaoCor] || acaoCores.blue;

  document.getElementById("content").innerHTML = `
    <!-- BANNER -->
    <div class="banner" style="background:linear-gradient(135deg,${p.bannerCor[0]},${p.bannerCor[1]})">
      <div class="banner-left">
        <div class="banner-icon">${p.bannerIcone}</div>
        <div>
          <div class="banner-title">${p.bannerTitulo}</div>
          <div class="banner-sub">${p.bannerSub}</div>
        </div>
      </div>
      <div class="banner-right">
        <div class="banner-value">${fmt(p.faturamento.realizado)}</div>
        <div class="banner-proj">${projPct ? `Projeção: ${fmt(p.faturamento.projecao)} (${projPct}%)` : `${percMeta}% da meta`}</div>
      </div>
    </div>

    <!-- PROGRESSO -->
    <div class="progress-section">
      <div class="section-title">Meta de Indicadores</div>
      ${progRow("Vendas", p.faturamento.realizado, p.faturamento.meta, fmt)}
      ${progRow("Visitas", p.metricas.visitas.realizado, p.metricas.visitas.meta, v=>v.toLocaleString("pt-BR"))}
      ${progRow("Pedidos", p.metricas.pedidos.realizado, p.metricas.pedidos.meta, v=>String(v))}
      ${progRow("Conversão", p.metricas.conversao.realizado, p.metricas.conversao.meta, v=>Number(v).toFixed(2), "%")}
      ${progRow("Ticket Médio", p.metricas.ticketMedio.realizado, p.metricas.ticketMedio.meta, fmt)}
    </div>

    <!-- KPIs -->
    <div class="kpis">
      ${kpiCard("👁️ Visitas", p.metricas.visitas.realizado.toLocaleString("pt-BR"), `Meta: ${p.metricas.visitas.meta.toLocaleString("pt-BR")}`, p.metricas.visitas.realizado, p.metricas.visitas.meta, "#f59e0b")}
      ${kpiCard("🛒 Pedidos", p.metricas.pedidos.realizado, `Meta: ${p.metricas.pedidos.meta}`, p.metricas.pedidos.realizado, p.metricas.pedidos.meta, "#1e3a8a")}
      ${kpiCard("📈 Conversão", Number(p.metricas.conversao.realizado).toFixed(2)+"%", `Meta: ${p.metricas.conversao.meta}%`, p.metricas.conversao.realizado, p.metricas.conversao.meta, "#16a34a")}
      ${kpiCard("💰 Ticket Médio", fmt(p.metricas.ticketMedio.realizado), `Meta: ${fmt(p.metricas.ticketMedio.meta)}`, p.metricas.ticketMedio.realizado, p.metricas.ticketMedio.meta, "#7c3aed")}
    </div>

    <!-- GRÁFICOS -->
    <div class="charts">
      <div class="chart-card">
        <div class="chart-title">Vendas vs Meta por Semana</div>
        <div class="chart-wrap"><canvas id="cA"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Desempenho por Semana</div>
        <div style="padding-top:4px">${semanasHtml}</div>
      </div>
    </div>

    <!-- ANÁLISE -->
    <div class="panel" style="margin-bottom:14px">
      <div class="panel-title">💡 Análise do Período</div>
      <div class="analise-box" style="background:${ac.bg};border-color:${ac.border}">
        <p style="font-size:13px;color:${ac.txt};line-height:1.6">${p.analise.txt}</p>
      </div>
      <div class="panel-title" style="margin-top:16px">Insights</div>
      ${p.insights.map(ins=>`
        <div class="insight-item ${ins.tipo}">
          <div class="insight-dot ${ins.tipo}"></div>
          <p class="insight-txt">${ins.texto}</p>
        </div>`).join("")}
    </div>

    <!-- AÇÕES -->
    <div class="panel">
      <div class="panel-title">🚀 Plano de Ação</div>
      ${p.acoes.map((a,i)=>`
        <div class="acao-item">
          <div class="acao-num">${i+1}</div>
          <p class="acao-txt">${a}</p>
        </div>`).join("")}
      <div class="analise-box" style="background:${acc.bg};border-color:${acc.border};margin-top:12px">
        <p style="font-size:13px;color:${acc.txt};line-height:1.6"><strong>🎯 Ação Prioritária:</strong> ${p.acaoPrioritaria}</p>
      </div>
    </div>
  `;

  renderGrafico(p);

  const c = document.getElementById("content");
  c.classList.remove("fade-up"); void c.offsetWidth; c.classList.add("fade-up");
}

function kpiCard(label, value, sub, real, meta, cor){
  const p = real/meta;
  const badgeCls = p >= 1 ? "up" : p >= 0.8 ? "ok" : "down";
  const badgeTxt = p >= 1 ? `▲ ${pct(real,meta)}%` : `${pct(real,meta)}%`;
  return `
  <div class="kpi-card">
    <div class="kpi-top">
      <div class="kpi-label">${label}</div>
      <div class="kpi-icon" style="background:${cor}15">&nbsp;</div>
    </div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-sub">${sub}</div>
    <span class="kpi-badge ${badgeCls}">${badgeTxt} da meta</span>
  </div>`;
}

function renderGrafico(p){
  if(chartA){ chartA.destroy(); chartA=null; }
  const semFiltradas = p.semanais.filter(s=>s.real>0||s.ok!==null);
  const labels = semFiltradas.map(s=>s.s);
  const reais  = semFiltradas.map(s=>s.real);
  const metas  = semFiltradas.map(s=>s.meta);

  const cA = document.getElementById("cA");
  if(!cA) return;

  const tick = { color:"#9ca3af", font:{size:11,family:"Mukta"} };
  const grid = { color:"rgba(0,0,0,0.05)" };

  chartA = new Chart(cA, {
    type:"bar",
    data:{
      labels,
      datasets:[
        { label:"Meta",      data:metas, backgroundColor:"#e5e7eb", borderRadius:5 },
        { label:"Realizado", data:reais, backgroundColor:"#1e3a8a", borderRadius:5 },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color:"#6b7280", font:{size:11,family:"Mukta"}, boxWidth:10 } } },
      scales:{
        x:{ grid:{display:false}, ticks:tick },
        y:{ grid, ticks:{ ...tick, callback:v=>"R$"+(v/1000).toFixed(0)+"k" } }
      }
    }
  });
}

function irPara(i){
  if(i<0||i>=HISTORICO.length) return;
  idxAtual=i;
  renderSeletor();
  renderConteudo();
  window.scrollTo({top:0,behavior:"smooth"});
}

renderSeletor();
renderConteudo();
</script>
</body>
</html>
